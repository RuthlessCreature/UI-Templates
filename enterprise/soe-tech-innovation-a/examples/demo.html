<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>国企科技创新</title><style>:root{--bg:#F0F6F8;--s:#FFFFFF;--alt:#E7F2F5;--line:#C6DDE3;--text:#173942;--muted:#68878E;--a:#087F8C;--ok:#2D936C;--warn:#C18A2C;--bad:#BE4B4B;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}header{height:64px;padding:0 24px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);background:var(--s)}.sig{font-size:12px;color:var(--muted)}main{padding:20px;min-height:calc(100vh - 64px)}.stage{min-height:720px;position:relative}.panel{background:var(--s);border:1px solid var(--line);border-radius:10px;padding:16px}.accent{color:var(--a)}.muted{color:var(--muted)}.metric{font-size:30px;font-weight:800}.line{border-top:1px solid var(--line);padding:12px 0}.ring{width:230px;height:230px;border:18px solid var(--a);border-radius:50%;display:grid;place-items:center}.grid{display:grid;gap:12px}@media(max-width:850px){.grid{display:block}.panel{margin-bottom:12px}}</style></head><body><header><b>国企科技创新</b><span class="sig">科创项目管线</span></header><main><div class="stage"><h2>科技项目管线</h2><div class="grid" style="grid-template-columns:repeat(5,1fr)"><div class="panel" style="">立项</div><div class="panel" style="">验证</div><div class="panel" style="background:var(--a);color:white">中试</div><div class="panel" style="">产业化</div><div class="panel" style="">推广</div></div><div class="grid" style="grid-template-columns:140px repeat(5,1fr);margin-top:14px"><b>智能制造</b><div class="panel">项目</div><div class="panel"></div><div class="panel">项目</div><div class="panel"></div><div class="panel">项目</div></div><div class="grid" style="grid-template-columns:140px repeat(5,1fr);margin-top:14px"><b>数字平台</b><div class="panel"></div><div class="panel">项目</div><div class="panel"></div><div class="panel">项目</div><div class="panel"></div></div><div class="grid" style="grid-template-columns:140px repeat(5,1fr);margin-top:14px"><b>新材料</b><div class="panel">项目</div><div class="panel"></div><div class="panel">项目</div><div class="panel"></div><div class="panel">项目</div></div><div class="grid" style="grid-template-columns:140px repeat(5,1fr);margin-top:14px"><b>绿色技术</b><div class="panel"></div><div class="panel">项目</div><div class="panel"></div><div class="panel">项目</div><div class="panel"></div></div></div></main></body></html>
