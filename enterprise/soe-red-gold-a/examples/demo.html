<!doctype html><html><head><meta charset="utf-8"><style>:root{--bg:#F7F4F1;--s:#FFFFFF;--a:#F3ECE8;--b:#D9CBC3;--t:#352522;--m:#796964;--x:#A61B1B;font-family:system-ui,"Segoe UI","Noto Sans SC",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t)}header{height:74px;background:var(--x);color:#fff;padding:0 28px;display:flex;align-items:center;gap:34px}header b{font-size:20px}main{padding:26px 5vw}.hero,.card,.panel{background:var(--s);border:1px solid var(--b);border-radius:3px}.hero{padding:24px;background:var(--a)}.k{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}.card{padding:18px}.v{font-size:30px;font-weight:700}.panels{display:grid;grid-template-columns:1.6fr 1fr;gap:12px;margin-top:12px}.panel{height:320px;padding:18px}.line{height:4px;background:var(--x);margin-top:130px;transform:skewY(-5deg)}@media(max-width:800px){.k{grid-template-columns:repeat(2,1fr)}.panels{grid-template-columns:1fr}}</style></head><body><header><b>国企红金</b><span>首页</span><span>工作台</span><span>项目</span><span>经营分析</span></header><main><div class="hero"><h1>综合工作台</h1><p style="color:var(--m)">今日重点事项、经营指标与待办任务</p></div><div class="k"><div class="card">待办<div class="v">18</div></div><div class="card">项目<div class="v">36</div></div><div class="card">完成<div class="v">124</div></div><div class="card">异常<div class="v">3</div></div></div><div class="panels"><div class="panel"><b>经营趋势</b><div class="line"></div></div><div class="panel"><b>通知与待办</b><p>重点事项 1</p><p>重点事项 2</p><p>重点事项 3</p></div></div></main></body></html>
