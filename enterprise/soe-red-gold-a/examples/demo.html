<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>国企红金</title><style>:root{--bg:#F7F4F1;--s:#FFFFFF;--alt:#F3ECE8;--line:#D9CBC3;--text:#352522;--muted:#796964;--a:#A61B1B;--ok:#4D805C;--warn:#B38738;--bad:#A61B1B;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}header{height:64px;padding:0 24px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);background:var(--s)}.sig{font-size:12px;color:var(--muted)}main{padding:20px;min-height:calc(100vh - 64px)}.stage{min-height:720px;position:relative}.panel{background:var(--s);border:1px solid var(--line);border-radius:10px;padding:16px}.accent{color:var(--a)}.muted{color:var(--muted)}.metric{font-size:30px;font-weight:800}.line{border-top:1px solid var(--line);padding:12px 0}.ring{width:230px;height:230px;border:18px solid var(--a);border-radius:50%;display:grid;place-items:center}.grid{display:grid;gap:12px}@media(max-width:850px){.grid{display:block}.panel{margin-bottom:12px}}</style></head><body><header><b>国企红金</b><span class="sig">庄重红金公报板</span></header><main><div class="stage"><div style="background:var(--a);color:white;padding:28px"><h2>综合信息公报</h2></div><div style="border-top:2px solid var(--warn);margin:24px 0"></div><h1>年度重点任务推进情况</h1><div class="grid" style="grid-template-columns:2fr 1fr"><div class="panel" style="height:380px">工作摘要</div><div class="panel"><h3 class="accent">专题</h3>01 改革专项<hr>02 安全生产<hr>03 科技创新<hr>04 人才发展</div></div></div></main></body></html>
