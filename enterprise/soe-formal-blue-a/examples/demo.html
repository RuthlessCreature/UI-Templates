<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>国企政务蓝</title><style>:root{--bg:#F3F6FA;--s:#FFFFFF;--alt:#EAF0F7;--line:#C9D5E3;--text:#18304B;--muted:#6D7F93;--a:#1E5AA8;--ok:#2E7D5A;--warn:#B98527;--bad:#B84242;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}header{height:64px;padding:0 24px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);background:var(--s)}.sig{font-size:12px;color:var(--muted)}main{padding:20px;min-height:calc(100vh - 64px)}.stage{min-height:720px;position:relative}.panel{background:var(--s);border:1px solid var(--line);border-radius:10px;padding:16px}.accent{color:var(--a)}.muted{color:var(--muted)}.metric{font-size:30px;font-weight:800}.line{border-top:1px solid var(--line);padding:12px 0}.ring{width:230px;height:230px;border:18px solid var(--a);border-radius:50%;display:grid;place-items:center}.grid{display:grid;gap:12px}@media(max-width:850px){.grid{display:block}.panel{margin-bottom:12px}}</style></head><body><header><b>国企政务蓝</b><span class="sig">正式综合门户</span></header><main><div class="stage"><div style="background:var(--a);color:white;padding:24px"><h2>综合门户</h2></div><div class="grid" style="grid-template-columns:1.6fr 1fr;margin-top:12px"><div class="panel"><h3>通知公告</h3>01 年度重点项目推进通知<hr>02 经营调度会材料<hr>03 制度文件更新</div><div class="panel"><h3>待办</h3><div class="metric">18</div></div></div><div class="grid" style="grid-template-columns:repeat(3,1fr);margin-top:12px"><div class="panel"><h3>项目</h3></div><div class="panel"><h3>经营</h3></div><div class="panel"><h3>审批</h3></div><div class="panel"><h3>采购</h3></div><div class="panel"><h3>资产</h3></div><div class="panel"><h3>制度</h3></div></div></div></main></body></html>
