<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>:root{--bg:#F4F2F3;--s:#FFFFFF;--a:#ECE8EA;--b:#D8D0D4;--t:#292326;--m:#746A70;--x:#A63D63;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t)}header{height:66px;background:var(--s);border-bottom:1px solid var(--b);display:flex;align-items:center;padding:0 5vw;gap:28px}header span{color:var(--m)}main{padding:28px 5vw}.hero,.card,.week{border:1px solid var(--b);border-radius:9px;background:var(--s)}.hero{padding:34px;background:var(--a)}.hero h1{font-size:38px;margin:0 0 12px}.btn{background:var(--x);color:#fff;border:0;border-radius:9px;padding:12px 18px;font-weight:700}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}.card{padding:20px;min-height:160px}.week{padding:22px;background:var(--a)}@media(max-width:720px){header span{display:none}.cards{grid-template-columns:1fr}.hero h1{font-size:30px}}</style></head><body><header><b>都市轻熟</b><span>Explore</span><span>Bookings</span><span>Membership</span></header><main><div class="hero"><h1>Make today feel easier.</h1><p style="color:var(--m)">Your next booking, plan and benefits — in one place.</p><button class="btn">View plan</button></div><div class="cards"><div class="card"><b>Next appointment</b><p>Tuesday · 10:30</p></div><div class="card"><b>Member benefits</b><p>3 benefits available</p></div><div class="card"><b>Saved plan</b><p>Continue where you left off</p></div></div><div class="week"><b>This week</b><p style="color:var(--m)">A calm overview of your plans and progress.</p></div></main></body></html>
