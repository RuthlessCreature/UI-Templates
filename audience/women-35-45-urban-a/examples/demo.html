<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>都市轻熟</title><style>:root{--bg:#F4F2F3;--s:#FFFFFF;--alt:#ECE8EA;--line:#D8D0D4;--text:#292326;--muted:#746A70;--a:#A63D63;--ok:#4F8B6D;--warn:#B9853B;--bad:#B84C5D;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}header{height:64px;padding:0 24px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);background:var(--s)}.sig{font-size:12px;color:var(--muted)}main{padding:20px;min-height:calc(100vh - 64px)}.stage{min-height:720px;position:relative}.panel{background:var(--s);border:1px solid var(--line);border-radius:10px;padding:16px}.accent{color:var(--a)}.muted{color:var(--muted)}.metric{font-size:30px;font-weight:800}.line{border-top:1px solid var(--line);padding:12px 0}.ring{width:230px;height:230px;border:18px solid var(--a);border-radius:50%;display:grid;place-items:center}.grid{display:grid;gap:12px}@media(max-width:850px){.grid{display:block}.panel{margin-bottom:12px}}</style></head><body><header><b>都市轻熟</b><span class="sig">都市日程服务台</span></header><main><div class="stage"><div style="background:var(--text);color:white;padding:24px"><b>TODAY</b></div><h1>Your day, clearly arranged.</h1><div style="border-left:3px solid var(--line);padding-left:34px"><div class="panel" style="margin:18px 0;">09:00 Coffee & planning</div><div class="panel" style="margin:18px 0;border-color:var(--a)">10:30 Appointment</div><div class="panel" style="margin:18px 0;">14:00 Work session</div><div class="panel" style="margin:18px 0;">18:30 Dinner booking</div></div></div></main></body></html>
