<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>柔和健康</title><style>:root{--bg:#F2F6F5;--s:#FFFFFF;--alt:#E8F0EE;--line:#CFDBD8;--text:#263533;--muted:#6B7E7A;--a:#4D8B86;--ok:#4C9169;--warn:#C28B3C;--bad:#B85A5A;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}header{height:64px;padding:0 24px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);background:var(--s)}.sig{font-size:12px;color:var(--muted)}main{padding:20px;min-height:calc(100vh - 64px)}.stage{min-height:720px;position:relative}.panel{background:var(--s);border:1px solid var(--line);border-radius:10px;padding:16px}.accent{color:var(--a)}.muted{color:var(--muted)}.metric{font-size:30px;font-weight:800}.line{border-top:1px solid var(--line);padding:12px 0}.ring{width:230px;height:230px;border:18px solid var(--a);border-radius:50%;display:grid;place-items:center}.grid{display:grid;gap:12px}@media(max-width:850px){.grid{display:block}.panel{margin-bottom:12px}}</style></head><body><header><b>柔和健康</b><span class="sig">健康周环与习惯板</span></header><main><div class="stage"><h1>Your week</h1><p class="muted">Clear signals. Gentle guidance.</p><div class="grid" style="grid-template-columns:400px 1fr;align-items:center"><div class="ring">72%</div><div><div class="panel" style="margin:12px 0"><b>Sleep</b><div style="height:12px;background:var(--a);width:75%;margin-top:12px"></div></div><div class="panel" style="margin:12px 0"><b>Movement</b><div style="height:12px;background:var(--a);width:86%;margin-top:12px"></div></div><div class="panel" style="margin:12px 0"><b>Hydration</b><div style="height:12px;background:var(--a);width:64%;margin-top:12px"></div></div><div class="panel" style="margin:12px 0"><b>Recovery</b><div style="height:12px;background:var(--a);width:78%;margin-top:12px"></div></div><div class="panel"><small>Next action</small><h3 class="accent">Book your recovery session</h3></div></div></div></div></main></body></html>
