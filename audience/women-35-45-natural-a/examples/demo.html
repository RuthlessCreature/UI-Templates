<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自然生活</title><style>:root{--bg:#F4F5EF;--s:#FFFEFA;--alt:#E9EDE2;--line:#D2D8C8;--text:#2D342B;--muted:#747D70;--a:#6F8762;--ok:#5C8E65;--warn:#B88745;--bad:#B55D58;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}header{height:64px;padding:0 24px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);background:var(--s)}.sig{font-size:12px;color:var(--muted)}main{padding:20px;min-height:calc(100vh - 64px)}.stage{min-height:720px;position:relative}.panel{background:var(--s);border:1px solid var(--line);border-radius:10px;padding:16px}.accent{color:var(--a)}.muted{color:var(--muted)}.metric{font-size:30px;font-weight:800}.line{border-top:1px solid var(--line);padding:12px 0}.ring{width:230px;height:230px;border:18px solid var(--a);border-radius:50%;display:grid;place-items:center}.grid{display:grid;gap:12px}@media(max-width:850px){.grid{display:block}.panel{margin-bottom:12px}}</style></head><body><header><b>自然生活</b><span class="sig">自然日常计划板</span></header><main><div class="stage"><h1>This week</h1><div class="grid" style="grid-template-columns:420px 1fr;align-items:center"><div class="ring">5 / 7<br>days</div><div><div class="panel" style="margin:12px 0"><b>Morning walk</b><div style="height:10px;background:var(--a);width:72%;margin-top:12px"></div></div><div class="panel" style="margin:12px 0"><b>Water goal</b><div style="height:10px;background:var(--a);width:72%;margin-top:12px"></div></div><div class="panel" style="margin:12px 0"><b>Read 20 min</b><div style="height:10px;background:var(--a);width:72%;margin-top:12px"></div></div><div class="panel" style="margin:12px 0"><b>Plan tomorrow</b><div style="height:10px;background:var(--a);width:72%;margin-top:12px"></div></div></div></div></div></main></body></html>
