<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>美式金融科技</title><style>:root{--bg:#F3F6FA;--s:#FFFFFF;--a:#EAF0F6;--b:#D4DEE9;--t:#10243E;--m:#667A91;--x:#0B6E99;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t)}header{height:64px;background:var(--s);border-bottom:1px solid var(--b);display:flex;align-items:center;padding:0 28px;gap:28px}header span{color:var(--m)}header button{margin-left:auto;background:var(--x);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-weight:700}.wrap{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 64px)}aside{padding:24px;background:var(--a);border-right:1px solid var(--b)}.nav{padding:10px 12px;border-radius:8px;margin:4px 0}.nav.on{background:var(--s);color:var(--x);font-weight:700}main{padding:30px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:var(--s);border:1px solid var(--b);border-radius:8px}.card{padding:18px}.v{font-size:30px;font-weight:800;margin-top:8px}.panels{display:grid;grid-template-columns:1.6fr 1fr;gap:12px;margin-top:12px}.panel{padding:18px;height:320px}.chart{height:210px;margin-top:20px;position:relative;border-bottom:1px solid var(--b)}.chart:after{content:"";position:absolute;left:3%;right:3%;top:45%;height:4px;background:var(--x);transform:skewY(-6deg)}@media(max-width:850px){.wrap{grid-template-columns:1fr}aside{display:none}.cards{grid-template-columns:repeat(2,1fr)}.panels{grid-template-columns:1fr}}</style></head><body><header><b>美式金融科技</b><span>Overview</span><span>Analytics</span><button>New item</button></header><div class="wrap"><aside><div class="nav on">Dashboard</div><div class="nav">Projects</div><div class="nav">Customers</div><div class="nav">Reports</div></aside><main><h1>Good morning</h1><p style="color:var(--m)">Here is what needs your attention today.</p><div class="cards"><div class="card">Revenue<div class="v">$84.2k</div></div><div class="card">Users<div class="v">12,480</div></div><div class="card">Conversion<div class="v">18.6%</div></div><div class="card">Tasks<div class="v">23</div></div></div><div class="panels"><div class="panel"><b>Performance</b><div class="chart"></div></div><div class="panel"><b>Recent activity</b><p>Updated project A</p><p>Invited member</p><p>Report exported</p></div></div></main></div></body></html>
