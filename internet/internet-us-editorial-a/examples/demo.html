<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>美式编辑部</title><style>:root{--bg:#F8F7F3;--s:#FFFFFF;--alt:#F1EFE8;--line:#D8D4C9;--text:#171717;--muted:#6B6B65;--a:#111827;--ok:#2E7D32;--warn:#B7791F;--bad:#C0392B;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}header{height:64px;padding:0 24px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);background:var(--s)}.sig{font-size:12px;color:var(--muted)}main{padding:20px;min-height:calc(100vh - 64px)}.stage{min-height:720px;position:relative}.panel{background:var(--s);border:1px solid var(--line);border-radius:10px;padding:16px}.accent{color:var(--a)}.muted{color:var(--muted)}.metric{font-size:30px;font-weight:800}.line{border-top:1px solid var(--line);padding:12px 0}.ring{width:230px;height:230px;border:18px solid var(--a);border-radius:50%;display:grid;place-items:center}.grid{display:grid;gap:12px}@media(max-width:850px){.grid{display:block}.panel{margin-bottom:12px}}</style></head><body><header><b>美式编辑部</b><span class="sig">杂志式产品版</span></header><main><div class="stage"><div style="max-width:1200px;margin:auto"><h5>THE WEEKLY BRIEF</h5><h1 style="font-size:64px;line-height:1">Work smarter,<br>not noisier.</h1><hr><div class="grid" style="grid-template-columns:2fr 1fr"><article><h2>Retention improved 18%</h2><p>A plain-language analysis of what changed.</p><div class="panel" style="height:300px"></div></article><aside class="panel">01 Pricing experiment<hr>02 Customer interviews<hr>03 Onboarding friction</aside></div></div></div></main></body></html>
