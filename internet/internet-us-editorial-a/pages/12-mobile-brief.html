<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>美式编辑部 · 移动周报</title><style>
:root{--bg:#F8F7F3;--s:#FFFFFF;--alt:#F1EFE8;--line:#D8D4C9;--text:#171717;--muted:#6B6B65;--a:#111827;--ok:#2E7D32;--warn:#B7791F;--bad:#C0392B;font-family:Inter,system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);min-height:100%}body{font-size:15px}
.top{height:58px;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--s);position:sticky;top:0;z-index:5}
.brand{font-weight:800}.crumb{color:var(--muted);font-size:12px}.grow{flex:1}.state{color:var(--ok);font-weight:700}
.page{padding:16px;max-width:480px;margin:auto}.title{font-size:28px;letter-spacing:-.03em;margin:4px 0 6px}.lead{color:var(--muted);line-height:1.6;margin:0 0 22px}
.grid{display:grid;gap:12px}.card{background:var(--s);border:1px solid var(--line);border-radius:14px;padding:16px}.soft{background:var(--alt)}.k{font-size:28px;font-weight:800;letter-spacing:-.03em}.label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.btn{border:1px solid var(--line);background:var(--s);color:var(--text);height:40px;border-radius:9px;padding:0 14px;font-weight:700}.btn.primary{background:var(--a);color:#fff;border-color:var(--a)}
.badge{display:inline-flex;align-items:center;border:1px solid var(--line);padding:5px 8px;border-radius:999px;font-size:11px}.badge.ok{color:var(--ok)}.badge.warn{color:var(--warn)}.badge.bad{color:var(--bad)}
.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;border-bottom:1px solid var(--line);padding:12px 10px}.table th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.chart{height:220px;position:relative;border-bottom:1px solid var(--line);overflow:hidden}.chart:after{content:"";position:absolute;left:2%;right:2%;top:49%;height:4px;background:var(--a);transform:skewY(-7deg);box-shadow:0 74px 0 color-mix(in srgb,var(--a) 35%,transparent)}
.list>div{padding:12px 0;border-bottom:1px solid var(--line)}.canvas{min-height:260px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;position:relative;overflow:hidden}
.object{width:70%;height:34%;border:2px solid var(--a);position:relative}.object:before{content:"";position:absolute;left:20%;right:20%;top:16%;bottom:16%;border:1px solid var(--line)}.object:after{content:"";position:absolute;left:39%;right:39%;top:30%;bottom:30%;border:3px solid var(--bad)}
.progress{height:10px;background:var(--alt);border-radius:999px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--a);border-radius:inherit}
.timeline{border-left:2px solid var(--line);padding-left:24px}.timeline>div{position:relative;padding:0 0 26px}.timeline>div:before{content:"";position:absolute;left:-30px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--a)}
.hero{padding:26px;border:1px solid var(--line);background:var(--alt);border-radius:18px}.hero h1{font-size:34px;line-height:1.02;letter-spacing:-.045em;margin:0 0 14px}
.bottomnav{position:sticky;bottom:0;background:var(--s);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:10px 6px}.bottomnav span{text-align:center;font-size:11px;color:var(--muted)}
@media(max-width:900px){.desktop-grid{grid-template-columns:1fr!important}}
