<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>美式创意工作台</title><style>:root{--bg:#F7F6FB;--s:#FFFFFF;--alt:#F0EEF7;--line:#DDD8EA;--text:#1F1B2D;--muted:#746E82;--a:#7C3AED;--ok:#2D9D78;--warn:#D7902A;--bad:#D14D72;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}header{height:64px;padding:0 24px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);background:var(--s)}.sig{font-size:12px;color:var(--muted)}main{padding:20px;min-height:calc(100vh - 64px)}.stage{min-height:720px;position:relative}.panel{background:var(--s);border:1px solid var(--line);border-radius:10px;padding:16px}.accent{color:var(--a)}.muted{color:var(--muted)}.metric{font-size:30px;font-weight:800}.line{border-top:1px solid var(--line);padding:12px 0}.ring{width:230px;height:230px;border:18px solid var(--a);border-radius:50%;display:grid;place-items:center}.grid{display:grid;gap:12px}@media(max-width:850px){.grid{display:block}.panel{margin-bottom:12px}}</style></head><body><header><b>美式创意工作台</b><span class="sig">无限创作画布</span></header><main><div class="stage"><div class="grid" style="grid-template-columns:70px 1fr 280px"><div class="panel">◼<br><br>＋<br><br>⌘<br><br>✦</div><div class="panel" style="height:650px;position:relative"><div class="panel" style="position:absolute;left:12%;top:14%;width:38%;height:24%">Frame A</div><div class="panel" style="position:absolute;left:48%;top:40%;width:34%;height:28%">Frame B</div><div style="position:absolute;left:30%;bottom:20px;background:var(--text);color:white;padding:14px 24px;border-radius:28px">⌘K · Add · Generate · Arrange</div></div><div class="panel">Inspector<br><br>Frame<br><br>Layout<br><br>Style<br><br>Prompt</div></div></div></main></body></html>
