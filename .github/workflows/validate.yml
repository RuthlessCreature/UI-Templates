name: Validate UI Templates

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate template structure and neutrality
        run: python scripts/validate_template.py
      - name: Check gallery JavaScript syntax
        run: node --check docs/app.js
      - name: Check worker JavaScript syntax
        run: node --check worker/index.js
