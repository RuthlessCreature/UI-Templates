<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>蓝白工程台</title><style>
:root{--bg:#EAF1F7;--s:#FFFFFF;--alt:#F2F7FB;--line:#C1D0DC;--text:#192A35;--muted:#6B7E8B;--a:#1679D3;--ok:#31A36C;--warn:#D89426;--bad:#D84D53;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);min-height:100vh}.top{height:64px;padding:0 24px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);background:var(--s)}.sig{font-size:12px;color:var(--muted)}.stage{padding:20px}.panel{background:var(--s);border:1px solid var(--line);padding:16px}.accent{color:var(--a)}.ok{color:var(--ok)}.bad{color:var(--bad)}.muted{color:var(--muted)}.metric{font-size:30px;font-weight:800}.canvas{background:var(--alt);min-height:360px;display:grid;place-items:center;border:1px solid var(--line)}.object{width:46%;height:36%;border:2px solid var(--a);position:relative}.object:after{content:"";position:absolute;inset:28% 38%;border:3px solid var(--a)}.list div{padding:10px 0;border-bottom:1px solid var(--line)}.ring{width:250px;height:250px;border:18px solid var(--a);border-radius:50%;display:grid;place-items:center;margin:auto}.thumb{height:64px;background:var(--alt);border:1px solid var(--line);margin:8px 0}.danger{background:var(--a);color:#111;font-weight:900;padding:16px}.grid{display:grid;gap:12px;min-height:720px}.grid[data-a="precision-rail"]{grid-template-columns:70px 1fr 250px;grid-template-rows:1fr 140px}.grid[data-a="dockyard"]{grid-template-columns:250px 1fr 320px;grid-template-rows:1fr 170px}.grid[data-a="orbital-hud"]{position:relative;place-items:center}.grid[data-a="blueprint-sheet"]{grid-template-columns:1fr 240px}.grid[data-a="process-ribbon"]{grid-template-columns:1.7fr 1fr;grid-template-rows:90px 1fr}.grid[data-a="telemetry-wall"]{grid-template-columns:1.2fr 1fr;grid-template-rows:100px 1fr 1fr}.grid[data-a="lens-deck"]{grid-template-columns:280px 1fr 280px;align-items:center}.grid[data-a="industrial-bento"]{grid-template-columns:1fr 1.2fr 1fr;grid-template-rows:220px 1fr}.grid[data-a="hazard-bay"]{grid-template-columns:2fr 1fr;grid-template-rows:56px 1fr}.grid[data-a="classic-ide"]{grid-template-columns:250px 1fr 300px;grid-template-rows:50px 1fr 90px}.grid[data-a="radar-topology"]{grid-template-columns:260px 1fr 260px}.grid[data-a="instrument-rack"]{grid-template-columns:repeat(5,1fr)}.grid[data-a="evidence-lab"]{grid-template-columns:170px 1fr 390px}.grid[data-a="single-task-canvas"]{grid-template-columns:1fr 240px;max-width:1180px;margin:auto}.grid[data-a="device-stage"]{grid-template-columns:300px 1fr 300px;align-items:center}@media(max-width:850px){.grid{display:block}.panel{margin-bottom:12px}.canvas{min-height:330px}}</style></head><body><header class="top"><b>蓝白工程台</b><span class="sig">经典工程 IDE</span><span style="margin-left:auto" class="ok">● RUNNING</span></header><main class="stage"><section class="grid" data-a="classic-ide"><div class="panel" style="grid-column:1/-1">▣ ▤ ◫ ⊕ ⌖ ⎙ ◉</div><div class="panel list"><b>Workflow</b><div>Acquisition</div><div class="accent">Inspection</div><div>Measurement</div><div>Output</div></div><div class="panel canvas"><div class="object"></div></div><div class="panel list"><b>Parameters</b><div>Threshold <span class="accent">128</span></div><div>Tolerance ±0.02</div><div>Exposure 8 ms</div><div>Output Auto</div></div><div class="panel" style="grid-column:1/-1">Results · Variables · Messages · IO</div></section></main></body></html>
