<!doctype html><html><head><meta charset="utf-8"><title>酷炫操作台</title><style>:root{--bg:#030D16;--s:#071B2A;--a:#0A2738;--b:#125577;--t:#ECFAFF;--m:#82A9B9;--x:#00BFF3;--ok:#00D69D;--bad:#FF5267;font-family:system-ui}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t)}header{height:52px;background:var(--s);border-bottom:1px solid var(--b);padding:16px}main{padding:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.c,.p{background:var(--s);border:1px solid var(--b);border-radius:8px}.c{padding:12px}.v{font-size:30px;font-weight:700}.work{margin-top:12px;height:520px;display:grid;grid-template-columns:1fr 300px;gap:12px}.view{background:#051017;display:grid;place-items:center}.part{width:55%;height:40%;background:var(--a);border:2px solid var(--m);position:relative}.roi{position:absolute;inset:30% 38%;border:3px solid var(--x)}.side{padding:16px}input{width:100%;height:34px;background:var(--a);color:var(--t);border:1px solid var(--b);margin:8px 0 16px}.btn{background:var(--x);color:#fff;border:0;padding:10px 18px;border-radius:8px}</style></head><body><header><b>酷炫操作台</b> · Inspection / Station 01</header><main><div class="grid"><div class="c">Yield<div class="v" style="color:var(--ok)">99.65%</div></div><div class="c">Output<div class="v">12,684</div></div><div class="c">NG<div class="v" style="color:var(--bad)">47</div></div><div class="c">Cycle<div class="v">41ms</div></div></div><div class="work"><div class="p view"><div class="part"><div class="roi"></div></div></div><div class="p side"><b>Edge Inspection</b><p style="color:var(--m)">Threshold</p><input value="128"><p style="color:var(--m)">Minimum</p><input value="40"><button class="btn">Apply</button></div></div></main></body></html>
