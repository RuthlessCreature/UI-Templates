<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>未来蓝黑</title><style>
:root{--bg:#04101A;--surface:#071A29;--alt:#0A2234;--border:#0E4A6B;--text:#E8F8FF;--muted:#84AABD;--accent:#00C7FF;--ok:#23D18B;--danger:#FF5E6C;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-size:14px}.top{height:52px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:14px}.muted{color:var(--muted)}.sp{flex:1}.shell{display:grid;grid-template-columns:240px 1fr 320px;min-height:calc(100vh - 52px)}aside{background:var(--surface);padding:12px}.left{border-right:1px solid var(--border)}.right{border-left:1px solid var(--border)}.nav{padding:9px;margin:3px 0;border-radius:6px}.nav.on{background:var(--alt);color:var(--accent);font-weight:700;border:1px solid var(--accent)}main{padding:16px}.k{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card,.panel{background:var(--surface);border:1px solid var(--border);border-radius:6px}.card{padding:12px}.v{font-size:30px;font-weight:700;margin-top:5px}.good{color:var(--ok)}.bad{color:var(--danger)}.panel{margin-top:12px;overflow:hidden}.ph{height:42px;background:var(--alt);border-bottom:1px solid var(--border);padding:12px;font-weight:700}.work{height:430px;display:grid;place-items:center;background:#071118}.part{width:55%;height:45%;border:2px solid var(--muted);position:relative;background:#0A2234}.roi{position:absolute;left:42%;top:30%;width:20%;height:25%;border:3px solid var(--accent)}label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}input,select{width:100%;height:34px;background:var(--alt);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px}.btn{margin-top:18px;height:36px;padding:0 16px;border:0;border-radius:6px;background:var(--accent);color:#fff;font-weight:700}@media(max-width:1000px){.shell{grid-template-columns:210px 1fr}.right{display:none}.k{grid-template-columns:repeat(2,1fr)}}</style></head><body>
<div class="top"><b>未来蓝黑</b><span class="muted">Inspection / Station 01</span><span class="sp"></span><span class="good"><b>● RUNNING</b></span></div><div class="shell"><aside class="left"><div class="muted">WORKFLOW</div><div class="nav">Image Acquisition</div><div class="nav on">Inspection</div><div class="nav">Measurement</div><div class="nav">Alarm Center</div></aside><main><div class="k"><div class="card"><div class="muted">Yield</div><div class="v good">99.65%</div></div><div class="card"><div class="muted">Output</div><div class="v">12,684</div></div><div class="card"><div class="muted">NG</div><div class="v bad">47</div></div><div class="card"><div class="muted">Cycle Time</div><div class="v">41 ms</div></div></div><div class="panel"><div class="ph">Current Inspection</div><div class="work"><div class="part"><div class="roi"></div></div></div></div></main><aside class="right"><div class="muted">SELECTED TOOL</div><h3>Edge Inspection</h3><label>Threshold</label><input value="128"><label>Direction</label><select><option>Left → Right</option></select><label>Decision</label><select><option>Within Range</option></select><button class="btn">Apply</button></aside></div></body></html>
